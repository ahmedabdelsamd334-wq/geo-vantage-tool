<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOVANTAGE - رفع ملف CAD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 50px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .header img { max-height: 60px; }
        .header h1 { color: #1a237e; margin: 10px 0 5px; }
        .header p { color: #666; }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn-primary, .btn-secondary { padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 600; display: inline-block; }
        .btn-primary { background: #1a237e; color: white; border: none; cursor: pointer; font-family: 'Cairo', sans-serif; }
        .btn-primary:hover { background: #0d1b4a; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
        .file-input-wrapper { position: relative; }
        .file-input-wrapper input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-input-label { display: block; padding: 15px; border: 2px dashed #f57c00; border-radius: 10px; background: #fff8f0; color: #f57c00; text-align: center; font-weight: 600; }
        .flash-message { padding: 12px 20px; margin-bottom: 20px; border-radius: 8px; font-weight: 600; }
        .flash-message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash-message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <!-- رسائل flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="GEOVANTAGE">
            <h1>رفع ملف CAD جديد</h1>
            <p>سيتم إضافته إلى الخريطة الرئيسية</p>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="cad_file">اختر ملف DXF أو DWG:</label>
                <div class="file-input-wrapper">
                    <input type="file" name="cad_file" id="cad_file" accept=".dxf,.dwg" required>
                    <span class="file-input-label"><i class="fas fa-cloud-upload-alt"></i> اضغط هنا لاختيار ملف...</span>
                </div>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn-primary"><i class="fas fa-arrow-left"></i> رفع واستعراض الطبقات</button>
                <a href="/" class="btn-secondary"><i class="fas fa-times"></i> إلغاء</a>
            </div>
        </form>
    </div>

</body>
</html>
